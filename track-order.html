<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivre ma Commande | Douéra Shop</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <style>
        @media (max-width: 600px) {
            .stepper-container {
                padding: 24px !important;
            }
            .stepper-item {
                width: 60px !important;
            }
            .stepper-icon {
                width: 32px !important;
                height: 32px !important;
            }
            .stepper-icon i {
                width: 14px !important;
            }
            .stepper-label {
                font-size: 0.55rem !important;
            }
            .status-title {
                font-size: 1.6rem !important;
            }
            .stepper-line-bg, .stepper-line-active {
                top: 15px !important;
            }
        }
    </style>
</head>
<body class="animate-fade-in">
    <header id="main-header" style="padding: 8px 0; border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 1000;">
        <div class="container">
            <nav style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                <a href="index.html" class="logo" style="flex-shrink: 0;">
                    <img src="assets/logo douera shop.png" alt="Douéra Shop" style="height: 35px; width: auto; object-fit: contain;">
                </a>
                <div class="nav-icons" style="display: flex; align-items: center; gap: 16px;">
                    <!-- Theme & Currency Selectors -->
                    <select id="currency-select" class="currency-selector" title="Choisir la devise">
                        <option value="XOF">XOF (FCFA)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="USD">USD ($)</option>
                    </select>
                    <button id="theme-toggle-btn" class="theme-toggle-btn" title="Changer de thème">
                        <i data-lucide="moon"></i>
                    </button>
                    <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; border-radius: 12px;">
                        <i data-lucide="arrow-left" style="width: 18px;"></i> Boutique
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 100px 20px; max-width: 800px;">
        <div style="text-align: center; margin-bottom: 60px;">
            <h1 style="font-size: 3rem; margin-bottom: 16px;">Où est mon colis ?</h1>
            <p style="color: var(--color-muted); font-size: 1.1rem;">Entrez votre numéro de commande pour connaître l'état de votre livraison en temps réel.</p>
        </div>

        <div style="background: white; padding: 48px; border-radius: var(--radius-lg); box-shadow: var(--shadow-premium); border: 1px solid var(--color-border);">
            <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 800; font-size: 0.9rem; color: var(--color-primary-dark);">NUMÉRO DE COMMANDE</label>
                <div style="position: relative;">
                    <i data-lucide="hash" style="position: absolute; left: 20px; top: 18px; width: 24px; color: var(--color-muted);"></i>
                    <input type="text" id="orderIdInput" placeholder="Ex: ORD-1712345678" 
                           style="width: 100%; padding: 20px 20px 20px 60px; border-radius: 18px; border: 2px solid var(--color-border); font-size: 1.1rem; outline: none; transition: var(--transition-base);">
                </div>
            </div>
            <button id="trackBtn" class="btn btn-primary" style="width: 100%; padding: 20px; font-size: 1.1rem; border-radius: 18px; justify-content: center;">
                Suivre la livraison <i data-lucide="search" style="margin-left: 10px;"></i>
            </button>
        </div>

        <div id="trackingResult" style="display: none; margin-top: 48px;" class="animate-fade-in">
            <!-- Tracking result will be injected here -->
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script>
        window.confirmReceiptPublic = async (id) => {
            if (!confirm("Confirmez-vous avoir reçu votre colis ?")) return;
            const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : API_BASE_URL;
            try {
                const res = await fetch(`${API_URL}/orders/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'Livrée' })
                });
                if (res.ok) {
                    if (window.UI) {
                        UI.showToast("Réception confirmée avec succès !", "success");
                    }
                    setTimeout(() => window.location.reload(), 1000);
                } else {
                    if (window.UI) {
                        UI.showToast("Erreur lors de la confirmation", "error");
                    } else {
                        alert("Erreur lors de la confirmation");
                    }
                }
            } catch (err) {
                console.error(err);
                if (window.UI) {
                    UI.showToast("Erreur de connexion au serveur", "error");
                } else {
                    alert("Erreur de connexion au serveur");
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const trackBtn = document.getElementById('trackBtn');
            const orderIdInput = document.getElementById('orderIdInput');
            const resultArea = document.getElementById('trackingResult');

            // --- Auto-Search Logic ---
            const params = new URLSearchParams(window.location.search);
            const idFromUrl = params.get('id');
            if (idFromUrl) {
                orderIdInput.value = idFromUrl;
                setTimeout(() => trackBtn.click(), 500);
            }

            trackBtn.addEventListener('click', async () => {
                let orderIdRaw = orderIdInput.value.trim();
                const orderId = orderIdRaw.replace(/^#\s*/, '');
                if (!orderId) {
                    UI.showToast("Veuillez entrer un numéro de commande", "error");
                    return;
                }

                UI.setLoading(trackBtn, true, "Recherche...");
                
                try {
                    const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : API_BASE_URL;
                    const response = await fetch(`${API_URL}/orders`);
                    const orders = await response.json();
                    const order = orders.find(o => o.id === orderId);

                    if (!order) {
                        resultArea.innerHTML = `
                            <div style="text-align: center; padding: 40px; background: #FFF1F2; border-radius: 24px; border: 1px solid #FECACA; color: #991B1B;">
                                <i data-lucide="alert-circle" style="width: 48px; height: 48px; margin-bottom: 16px;"></i>
                                <h3 style="color: #991B1B;">Commande introuvable</h3>
                                <p>Vérifiez le numéro et réessayez. Si le problème persiste, contactez notre support WhatsApp.</p>
                            </div>
                        `;
                    } else {
                        const steps = [
                            { key: 'En attente', label: 'Reçue', icon: 'package', color: '#3B82F6' },
                            { key: 'En cours', label: 'Expédiée', icon: 'truck', color: '#F59E0B' },
                            { key: 'Livrée', label: 'Livrée', icon: 'check-circle', color: '#10B981' },
                            { key: 'Avis', label: 'Votre Avis', icon: 'star', color: '#8B5CF6' }
                        ];

                        // Normalisation du statut pour la correspondance
                        const statusNorm = order.status.toLowerCase().trim();
                        let currentStepIndex = 0; // Par défaut: Reçue
                        
                        if (statusNorm.includes('cours') || statusNorm.includes('expédi') || statusNorm.includes('en route')) {
                            currentStepIndex = 1; // Expédiée
                        } else if (statusNorm.includes('livré')) {
                            currentStepIndex = order.review_id ? 3 : 2; // Livrée ou Avis
                        }

                        const activeColor = steps[currentStepIndex]?.color || '#6B7280';

                        resultArea.innerHTML = `
                            <div class="stepper-container" style="background: white; padding: 40px; border-radius: 24px; border: 1px solid var(--color-border); box-shadow: var(--shadow-premium);">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;">
                                    <div>
                                        <p style="color: var(--color-muted); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Status actuel</p>
                                        <h2 class="status-title" style="font-size: 2.2rem; color: ${activeColor}; margin: 0;">${order.status === 'En cours' ? 'Expédiée' : order.status}</h2>
                                    </div>
                                    <div style="text-align: right;">
                                        <p style="color: var(--color-muted); font-size: 0.85rem; margin-bottom: 4px;">Commande #${order.id}</p>
                                        <p style="font-weight: 800; font-size: 1.1rem; margin-bottom: 12px;">${window.formatPrice(order.total)}</p>
                                                     ${(statusNorm.includes('cours') || statusNorm.includes('expédi')) ? `
                                            <button onclick="confirmReceiptPublic('${order.id}')" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.75rem; border-radius: 8px; background: #10B981; border: none;">
                                                Confirmer la réception
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                                
                                <!-- Stepper Multi-Couleurs Alibaba -->
                                <div style="display: flex; justify-content: space-between; margin-bottom: 48px; position: relative; padding: 0 5px;">
                                    <div class="stepper-line-bg" style="position: absolute; top: 20px; left: 20px; right: 20px; height: 4px; background: #E5E7EB; z-index: 0;"></div>
                                    <div class="stepper-line-active" style="position: absolute; top: 20px; left: 20px; width: calc(${(currentStepIndex / 3) * 100}% - 10px); max-width: calc(100% - 40px); height: 4px; background: ${activeColor}; z-index: 1; transition: all 1s ease;"></div>
                                    
                                    ${steps.map((step, index) => {
                                        const isReached = index <= currentStepIndex;
                                        const stepColor = isReached ? step.color : '#E5E7EB';
                                        const iconColor = isReached ? 'white' : '#9CA3AF';
                                        const textColor = isReached ? step.color : '#9CA3AF';

                                        return `
                                            <div class="stepper-item" style="z-index: 2; text-align: center; width: 80px;">
                                                <div class="stepper-icon" style="width: 44px; height: 44px; border-radius: 50%; background: ${isReached ? step.color : 'white'}; border: 3px solid ${stepColor}; color: ${iconColor}; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; transition: all 0.4s ease; box-shadow: ${isReached ? `0 4px 12px ${step.color}40` : 'none'};">
                                                    <i data-lucide="${step.icon}"></i>
                                                </div>
                                                <span class="stepper-label" style="font-weight: 900; color: ${textColor}; white-space: nowrap; text-transform: uppercase; display: block;">${step.label}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>

                                    <div style="background: var(--color-background); padding: 32px; border-radius: 20px; border: 1px solid var(--color-border);">
                                        <div style="display: flex; gap: 20px; align-items: center;">
                                            <div style="width: 60px; height: 60px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-border);">
                                                <i data-lucide="map-pin" style="color: var(--color-primary);"></i>
                                            </div>
                                            <div>
                                                <h4 style="margin-bottom: 4px;">Destination de livraison</h4>
                                                <p style="color: var(--color-muted); font-size: 0.9rem;">
                                                    ${order.customer_firstname || order.customerfirstname || 'Client'} 
                                                    ${order.customer_lastname || order.customerlastname || ''} • 
                                                    ${order.customer_address || order.customeraddress || 'Adresse non précisée'}
                                                </p>
                                            </div>
                                        </div>
                                    
                                    ${order.status === 'Livrée' && !order.review_id ? `
                                        <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--color-border); text-align: center;">
                                            <p style="margin-bottom: 16px; font-weight: 700;">Votre avis nous est précieux !</p>
                                            <a href="account/review.html?orderId=${order.id}" class="btn btn-primary" style="width: 100%; border-radius: 14px; background: ${steps[3].color}; border: none;">Laisser un avis sur ma commande</a>
                                        </div>
                                    ` : ''}
                                    
                                    ${order.review_id ? `
                                        <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--color-border); text-align: center; color: var(--color-success);">
                                            <p style="font-weight: 700;"><i data-lucide="star" style="width: 16px; vertical-align: middle;"></i> Merci pour votre avis !</p>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }
                    resultArea.style.display = 'block';
                    if (window.lucide) lucide.createIcons();
                } catch (err) {
                    UI.showToast("Erreur lors de la recherche", "error");
                } finally {
                    UI.setLoading(trackBtn, false, "Suivre la livraison");
                }
            });
        });

        // --- Currency & Theme Utilities ---
        window.formatPrice = function(priceXOF) {
            const currency = localStorage.getItem('douera_currency') || 'XOF';
            if (currency === 'EUR') {
                const price = Math.round(priceXOF / 655);
                return price + ' €';
            } else if (currency === 'USD') {
                const price = Math.round(priceXOF / 600);
                return price + ' $';
            }
            return new Intl.NumberFormat('fr-FR').format(priceXOF) + ' XOF';
        };

        function initTheme() {
            const theme = localStorage.getItem('douera_theme') || 'light';
            document.body.classList.toggle('dark-mode', theme === 'dark');
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.innerHTML = theme === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
                if (window.lucide) lucide.createIcons();
            }
        }

        function initCurrency() {
            const currency = localStorage.getItem('douera_currency') || 'XOF';
            const currencySelect = document.getElementById('currency-select');
            if (currencySelect) {
                currencySelect.value = currency;
                currencySelect.onchange = (e) => {
                    localStorage.setItem('douera_currency', e.target.value);
                    window.location.reload();
                };
            }
        }

        initTheme();
        initCurrency();

        const themeBtn = document.getElementById('theme-toggle-btn');
        if (themeBtn) {
            themeBtn.onclick = () => {
                const isDark = document.body.classList.contains('dark-mode');
                const newTheme = isDark ? 'light' : 'dark';
                localStorage.setItem('douera_theme', newTheme);
                document.body.classList.toggle('dark-mode', newTheme === 'dark');
                themeBtn.innerHTML = newTheme === 'dark' ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
                if (window.lucide) lucide.createIcons();
            };
        }
    </script>
</body>
</html>
