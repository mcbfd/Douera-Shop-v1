<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Commandes | Douéra Shop Admin</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Mobile Menu Toggle -->
        <button id="mobileMenuBtn" class="mobile-menu-btn">
            <i data-lucide="menu"></i>
        </button>

        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="adminSidebar">
            <div class="sidebar-logo">
                <a href="../index.html">
                    <img src="../assets/logo douera shop.png" alt="Douéra Shop" style="height: 35px; width: auto; object-fit: contain;">
                </a>
                <button id="closeSidebarBtn" class="close-sidebar-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="products.html" class="nav-item"><i data-lucide="package"></i> Produits</a>
                <a href="orders.html" class="nav-item active"><i data-lucide="shopping-cart"></i> Commandes</a>
                <a href="users.html" class="nav-item"><i data-lucide="users"></i> Utilisateurs</a>
                <a href="reviews.html" class="nav-item"><i data-lucide="star"></i> Avis Clients</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn" style="color: #F87171;"><i data-lucide="log-out"></i> Déconnexion</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1>Gestion des Commandes</h1>
                    <p style="color: var(--color-muted);">Suivez vos ventes en temps réel.</p>
                </div>
                <div id="bulk-actions" class="header-actions" style="display: none;">
                    <span id="selection-count" style="font-weight: 700; color: var(--color-primary); font-size: 0.85rem;">0 sélec.</span>
                    <button class="btn" style="background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5;" onclick="deleteSelectedOrders()">
                        <i data-lucide="trash-2"></i> Supprimer
                    </button>
                </div>
            </header>

            <div class="data-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this.checked)"></th>
                            <th>ID Commande</th>
                            <th>Date</th>
                            <th>Client / Contact</th>
                            <th>Mode Paiement</th>
                            <th>Total</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list-body">
                        <!-- JS feeds this -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content" style="max-width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px;">
                <div>
                    <h2 id="order-id-title" style="margin-bottom: 4px;">Commande #REF</h2>
                    <p id="order-date" style="color: var(--color-muted);"></p>
                </div>
                <div id="order-status-badge"></div>
            </div>

            <div class="modal-grid">
                <div>
                    <h4 style="margin-bottom: 12px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; color: var(--color-muted);">Articles</h4>
                    <div id="order-items-list" style="display: flex; flex-direction: column; gap: 12px;">
                        <!-- Items -->
                    </div>

                    <h4 style="margin-top: 32px; margin-bottom: 12px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; color: var(--color-muted);">Informations Client</h4>
                    <div id="customer-info" style="background: var(--color-background); padding: 16px; border-radius: 12px; font-size: 0.9rem;">
                        <p id="customer-name" style="font-weight: 700; margin-bottom: 4px;"></p>
                        <p id="customer-phone" style="margin-bottom: 8px; color: var(--color-primary); font-weight: 600;"></p>
                        <p id="customer-address" style="color: var(--color-muted); line-height: 1.4;"></p>
                    </div>
                </div>
                <div>
                    <h4 style="margin-bottom: 12px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; color: var(--color-muted);">Modifier le Statut</h4>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <button class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="updateStatus('Payé')">💎 Marquer comme Payé</button>
                        <button class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="updateStatus('En préparation')">📦 En préparation</button>
                        <button class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="updateStatus('Expédié')">🚚 Expédié</button>
                        <button class="btn btn-primary" style="text-align: left; justify-content: flex-start;" onclick="updateStatus('Livré')">✅ Marquer comme Livré</button>
                        <button class="btn btn-outline" style="text-align: left; justify-content: flex-start; color: #DC2626; border-color: rgba(220, 38, 38, 0.2);" onclick="updateStatus('Annulé')">❌ Annuler</button>
                    </div>
                </div>
            </div>

            <div style="padding-top: 24px; border-top: 1px solid var(--color-border); text-align: right;">
                <button class="btn btn-outline" onclick="closeModal()">Fermer</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin-service.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        let allOrders = [];
        let lastRecentOrderId = null;

        const playNotificationSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, time, duration) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(time);
                    osc.stop(time + duration);
                };
                playTone(523.25, ctx.currentTime, 0.15); // C5 (Ding)
                playTone(659.25, ctx.currentTime + 0.1, 0.3); // E5 (Dong)
            } catch (e) {
                console.error("Audio Notification Error:", e);
            }
        };

        const showToastNotification = (order) => {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 24px;
                right: 24px;
                background: var(--color-primary-dark);
                color: white;
                padding: 16px 24px;
                border-radius: 16px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.15);
                z-index: 10000;
                display: flex;
                align-items: center;
                gap: 16px;
                animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                border: 1px solid rgba(255,255,255,0.1);
            `;
            
            toast.innerHTML = `
                <div style="background: rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="bell" style="width: 20px; height: 20px; color: #FBBF24;"></i>
                </div>
                <div style="flex: 1;">
                    <div style="font-weight: 800; font-size: 0.95rem; margin-bottom: 2px;">Nouvelle Commande !</div>
                    <div style="font-size: 0.8rem; opacity: 0.8;">#${(order.id || '').substring(0, 8)} par ${order.customer_firstname || 'Client'} (${(order.total || 0).toLocaleString()} XOF)</div>
                </div>
            `;
            
            document.body.appendChild(toast);
            if (window.lucide) lucide.createIcons({ root: toast });
            
            if (!document.getElementById('toast-anim-styles')) {
                const style = document.createElement('style');
                style.id = 'toast-anim-styles';
                style.textContent = `
                    @keyframes slideUp {
                        from { transform: translateY(100px) scale(0.9); opacity: 0; }
                        to { transform: translateY(0) scale(1); opacity: 1; }
                    }
                    @keyframes fadeOut {
                        to { opacity: 0; transform: translateY(-20px); }
                    }
                `;
                document.head.appendChild(style);
            }
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.4s forwards';
                setTimeout(() => toast.remove(), 400);
            }, 5000);
        };

        document.addEventListener('DOMContentLoaded', () => {
            AdminService.checkAuth();
            
            // Mobile Menu Logic
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');

            const toggleMobileMenu = (show) => {
                sidebar.classList.toggle('active', show);
                overlay.style.display = show ? 'block' : 'none';
                document.body.style.overflow = show ? 'hidden' : '';
            };

            if (mobileMenuBtn) mobileMenuBtn.onclick = () => toggleMobileMenu(true);
            if (closeSidebarBtn) closeSidebarBtn.onclick = () => toggleMobileMenu(false);
            if (overlay) overlay.onclick = () => toggleMobileMenu(false);

            AdminService.startAutoRefresh(refreshData, 30000); 
            document.getElementById('logoutBtn').onclick = () => AdminService.logout();
        });

        async function refreshData() {
            allOrders = await AdminService.getOrders();
            
            // Détection et notification d'une nouvelle commande
            if (allOrders && allOrders.length > 0) {
                const newestOrder = allOrders[0];
                if (lastRecentOrderId !== null && lastRecentOrderId !== newestOrder.id) {
                    playNotificationSound();
                    showToastNotification(newestOrder);
                }
                lastRecentOrderId = newestOrder.id;
            }
            
            renderOrders();
        }

        function renderOrders() {
            const list = document.getElementById('orders-list-body');
            list.innerHTML = '';
            
            if (allOrders.length === 0) {
                list.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--color-muted); padding: 40px;">Aucune commande trouvée.</td></tr>';
                return;
            }

            allOrders.forEach(o => {
                const tr = document.createElement('tr');
                tr.className = 'animate-fade-in';
                tr.innerHTML = `
                    <td data-label="Sélection"><input type="checkbox" class="order-checkbox" value="${o.id}" onclick="updateSelection()"></td>
                    <td data-label="ID" style="font-family: monospace; font-weight: 800; color: var(--color-foreground);">#${(o.id || 'N/A').substring(0, 8)}</td>
                    <td data-label="Date" style="color: var(--color-muted); font-size: 0.95rem;">${new Date(isNaN(o.date) ? o.date : parseInt(o.date)).toLocaleDateString()}</td>
                    <td data-label="Client">
                        <div style="font-weight: 800; color: var(--color-primary-dark);">${o.customer_firstname || 'Invité'} ${o.customer_lastname || ''}</div>
                        <div style="font-size: 0.8rem; color: var(--color-muted);">${o.customer_phone || 'Pas de tel'}</div>
                    </td>
                    <td data-label="Paiement"><span style="background: rgba(43, 89, 162, 0.05); padding: 4px 10px; border-radius: 8px; font-weight: 800; color: var(--color-primary-dark); font-size: 0.8rem; text-transform: uppercase;">${o.method || 'CASH'}</span></td>
                    <td data-label="Total" style="font-weight: 800; color: var(--color-primary-dark); font-family: 'Outfit', sans-serif;">${(o.total || 0).toLocaleString()} XOF</td>
                    <td data-label="Statut"><span class="badge ${getStatusClass(o.status)}">${o.status}</span></td>
                    <td data-label="Actions" style="display: flex; gap: 8px;">
                        <button class="btn" style="padding: 10px 15px; border-radius: 10px; font-weight: 800; font-size: 0.85rem; background: rgba(43, 89, 162, 0.05); color: var(--color-primary); border: none; cursor: pointer;" onclick="openOrderModal('${o.id}')">Détails</button>
                        <button class="btn" style="padding: 10px; border-radius: 10px; background: #FEE2E2; color: #DC2626; border: none; cursor: pointer;" onclick="confirmDeleteOrder('${o.id}')"><i data-lucide="trash-2" style="width: 16px;"></i></button>
                    </td>
                `;
                list.appendChild(tr);
            });
            if (window.lucide) lucide.createIcons();
        }

        async function openOrderModal(id) {
            currentOrderId = id;
            const order = allOrders.find(o => o.id === id);
            if (!order) return;

            // Parsing des items si c'est une chaîne JSON
            let items = order.items;
            if (typeof items === 'string') {
                try { items = JSON.parse(items); } catch(e) { items = []; }
            }

            document.getElementById('order-id-title').textContent = "Commande #" + id.substring(0, 8);
            document.getElementById('order-date').textContent = "Passée le " + new Date(isNaN(order.date) ? order.date : parseInt(order.date)).toLocaleString();

            const badge = document.getElementById('order-status-badge');
            badge.innerHTML = `<span class="badge ${getStatusClass(order.status)}" style="font-size: 1rem; padding: 10px 20px;">${order.status}</span>`;

            const itemsList = document.getElementById('order-items-list');
            itemsList.innerHTML = '';
            
            if (Array.isArray(items)) {
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.style.cssText = 'display: flex; gap: 12px; align-items: center; background: var(--color-background); padding: 12px; border-radius: 12px;';
                    div.innerHTML = `
                        <div style="font-weight: 800; color: var(--color-primary); width: 24px;">${item.quantity || 1}x</div>
                        <div style="flex: 1; font-weight: 600;">${item.name || 'Produit'}</div>
                        <div style="color: var(--color-muted);">${(item.price || 0).toLocaleString()} XOF</div>
                    `;
                    itemsList.appendChild(div);
                });
            }

            // Customer Info
            document.getElementById('customer-name').textContent = (order.customer_firstname || 'Invité') + ' ' + (order.customer_lastname || '');
            document.getElementById('customer-phone').textContent = "📞 " + (order.customer_phone || 'Non renseigné');
            document.getElementById('customer-address').textContent = "📍 " + (order.customer_address || 'Adresse non précisée');

            // Add Invoice Link and Review display
            const actionArea = document.getElementById('customer-info');
            actionArea.innerHTML += `
                <div style="margin-top: 16px; border-top: 1px solid var(--color-border); padding-top: 16px;">
                    <a href="../invoice.html?orderId=${order.id}" target="_blank" class="btn btn-outline" style="width: 100%; justify-content: center; font-size: 0.8rem; padding: 10px;">
                        <i data-lucide="file-text" style="width: 14px; margin-right: 6px;"></i> Voir la Facture Client
                    </a>
                </div>
            `;

            // Check for review
            const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : '/api';
            try {
                const res = await fetch(`${API_URL}/reviews`);
                if (res.ok) {
                    const reviews = await res.json();
                    const review = reviews.find(r => r.orderId === order.id || r.orderid === order.id);
                    if (review) {
                        const rProd = parseInt(review.rating_product || review.ratingproduct || 5);
                        actionArea.innerHTML += `
                            <div style="margin-top: 16px; padding: 16px; background: #FFFBEB; border: 1px solid #FEF3C7; border-radius: 12px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <span style="font-size: 0.75rem; font-weight: 800; color: #D97706;">AVIS CLIENT</span>
                                    <div style="color: #F59E0B; font-size: 0.8rem;">${'★'.repeat(rProd)}${'☆'.repeat(5-rProd)}</div>
                                </div>
                                <p style="font-size: 0.85rem; color: #92400E; font-style: italic;">"${review.comment || 'Aucun commentaire'}"</p>
                                <a href="reviews.html" style="display: block; margin-top: 8px; font-size: 0.75rem; font-weight: 700; color: var(--color-primary);">Répondre à cet avis →</a>
                            </div>
                        `;
                    }
                }
            } catch(e) {}

            document.getElementById('orderModal').classList.add('active');
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        async function updateStatus(newStatus) {
            await AdminService.updateOrderStatus(currentOrderId, newStatus);
            UI.showToast("Statut mis à jour", "success");
            closeModal();
            await refreshData();
        }

        // Selection & Delete Logic
        function toggleSelectAll(checked) {
            document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = checked);
            updateSelection();
        }

        function updateSelection() {
            const selected = document.querySelectorAll('.order-checkbox:checked');
            const bulkActions = document.getElementById('bulk-actions');
            const countLabel = document.getElementById('selection-count');
            
            if (selected.length > 0) {
                bulkActions.style.display = 'flex';
                countLabel.textContent = `${selected.length} sélectionné(s)`;
            } else {
                bulkActions.style.display = 'none';
                document.getElementById('select-all').checked = false;
            }
        }

        async function confirmDeleteOrder(id) {
            const confirmed = await UI.showConfirm(
                "Supprimer la commande ?",
                "Cette action est irréversible et supprimera toutes les données liées à cette vente."
            );
            if (confirmed) {
                await AdminService.deleteOrder(id);
                UI.showToast("Commande supprimée avec succès", "success");
                await refreshData();
            }
        }

        async function deleteSelectedOrders() {
            const selected = Array.from(document.querySelectorAll('.order-checkbox:checked')).map(cb => cb.value);
            const confirmed = await UI.showConfirm(
                "Suppression groupée",
                `Voulez-vous vraiment supprimer les ${selected.length} commandes sélectionnées ?`
            );
            if (confirmed) {
                UI.showToast("Suppression en cours...", "info");
                for (const id of selected) {
                    await AdminService.deleteOrder(id);
                }
                UI.showToast("Toutes les commandes ont été supprimées", "success");
                document.getElementById('select-all').checked = false;
                await refreshData();
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'Payé': return 'badge-paid';
                case 'Livré': return 'badge-delivered';
                case 'Expédié': return 'badge-shipping';
                case 'Annulé': return 'badge-pending'; // CSS reuse
                default: return 'badge-pending';
            }
        }
    </script>
</body>

</html>
