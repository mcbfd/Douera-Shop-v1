<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Clients | Douéra Shop Admin</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>
<body>

    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo douera shop.png" alt="Douéra Shop" style="width: 150px;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="products.html" class="nav-item"><i data-lucide="package"></i> Produits</a>
                <a href="orders.html" class="nav-item"><i data-lucide="shopping-cart"></i> Commandes</a>
                <a href="users.html" class="nav-item"><i data-lucide="users"></i> Utilisateurs</a>
                <a href="reviews.html" class="nav-item active"><i data-lucide="star"></i> Avis Clients</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn" style="color: #F87171;"><i data-lucide="log-out"></i> Déconnexion</a>
            </div>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1 style="font-size: 2rem;">Avis Clients</h1>
                    <p style="color: var(--color-muted);">Consultez les retours sur vos produits et votre service.</p>
                </div>
            </header>

            <div class="stat-grid" style="margin-bottom: 40px;">
                <div class="stat-card">
                    <div>
                        <p style="color: var(--color-muted); font-size: 0.9rem; font-weight: 600;">Note Moyenne Produit</p>
                        <p class="stat-val" id="avg-product">0.0 / 5</p>
                    </div>
                    <div class="stat-icon" style="background: #FEF3C7; color: #F59E0B;"><i data-lucide="star"></i></div>
                </div>
                <div class="stat-card">
                    <div>
                        <p style="color: var(--color-muted); font-size: 0.9rem; font-weight: 600;">Note Moyenne Service</p>
                        <p class="stat-val" id="avg-service">0.0 / 5</p>
                    </div>
                    <div class="stat-icon" style="background: #DBEAFE; color: #2B59A2;"><i data-lucide="truck"></i></div>
                </div>
                <div class="stat-card">
                    <div>
                        <p style="color: var(--color-muted); font-size: 0.9rem; font-weight: 600;">Total Avis</p>
                        <p class="stat-val" id="total-reviews">0</p>
                    </div>
                    <div class="stat-icon" style="background: #DCFCE7; color: #166534;"><i data-lucide="message-square"></i></div>
                </div>
            </div>

            <div class="data-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Client</th>
                            <th>Commande</th>
                            <th>Note Produit</th>
                            <th>Note Service</th>
                            <th>Commentaire</th>
                        </tr>
                    </thead>
                    <tbody id="reviews-list">
                        <!-- JS feeds this -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!AdminService.checkAuth()) return;
            document.getElementById('logoutBtn').onclick = () => AdminService.logout();

            const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : '/api';
            
            try {
                const res = await fetch(`${API_URL}/reviews`);
                const reviews = await res.json();

                renderReviews(reviews);
                updateStats(reviews);
            } catch (err) {
                console.error("Erreur chargement avis:", err);
            }

            if (window.lucide) lucide.createIcons();
        });

        function renderReviews(reviews) {
            const list = document.getElementById('reviews-list');
            list.innerHTML = '';

            if (reviews.length === 0) {
                list.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--color-muted);">Aucun avis pour le moment.</td></tr>';
                return;
            }

            console.log("Avis reçus:", reviews);
            reviews.forEach(rev => {
                try {
                    const tr = document.createElement('tr');
                    tr.className = 'animate-fade-in';
                    
                    // Date robuste
                    let dateStr = 'Récent';
                    try {
                        const rawDate = rev.date || rev.created_at;
                        const d = new Date(rawDate);
                        if (!isNaN(d.getTime())) {
                            dateStr = d.toLocaleDateString();
                        }
                    } catch(e) {}
                    
                    const ratingProd = parseInt(rev.rating_product || rev.ratingproduct || 5);
                    const ratingServ = parseInt(rev.rating_service || rev.ratingservice || 5);
                    const oId = rev.orderId || rev.orderid || 'N/A';
                    const uName = rev.userName || rev.username || 'Client Douéra';

                    tr.innerHTML = `
                        <td style="color: var(--color-muted); font-size: 0.85rem;">${dateStr}</td>
                        <td>
                            <div style="font-weight: 700; color: var(--color-primary-dark);">${uName}</div>
                        </td>
                        <td style="font-family: monospace; font-weight: 700; color: var(--color-primary);">#${String(oId).substring(0,8)}</td>
                        <td>
                            <div style="display: flex; gap: 2px; color: #F59E0B;">
                                ${'★'.repeat(ratingProd)}${'☆'.repeat(5-ratingProd)}
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; gap: 2px; color: var(--color-primary);">
                                ${'★'.repeat(ratingServ)}${'☆'.repeat(5-ratingServ)}
                            </div>
                        </td>
                        <td style="max-width: 400px;">
                            <div style="margin-bottom: 12px;">
                                <p style="font-size: 0.9rem; color: var(--color-foreground); line-height: 1.4; font-style: italic;">"${rev.comment || 'Sans commentaire'}"</p>
                            </div>
                        
                        ${rev.admin_reply ? `
                            <div style="background: rgba(43, 89, 162, 0.05); padding: 12px; border-radius: 10px; border-left: 3px solid var(--color-primary); margin-top: 8px;">
                                <p style="font-size: 0.8rem; font-weight: 800; color: var(--color-primary); margin-bottom: 4px;">Votre réponse :</p>
                                <p style="font-size: 0.85rem; color: var(--color-primary-dark);">${rev.admin_reply}</p>
                                <div style="display: flex; gap: 12px; align-items: center; margin-top: 4px;">
                                    <button onclick="toggleReply('${rev.id}')" style="background: none; border: none; color: var(--color-muted); font-size: 0.75rem; text-decoration: underline; cursor: pointer;">Modifier</button>
                                    <button onclick="confirmDeleteReview('${rev.id}')" style="background: none; border: none; color: #DC2626; font-size: 0.75rem; text-decoration: underline; cursor: pointer;">Supprimer l'avis</button>
                                </div>
                            </div>
                        ` : `
                            <div style="display: flex; gap: 8px;">
                                <button class="btn btn-outline" onclick="toggleReply('${rev.id}')" style="padding: 6px 12px; font-size: 0.8rem; border-radius: 8px;">Répondre</button>
                                <button class="btn" onclick="confirmDeleteReview('${rev.id}')" style="padding: 6px; border-radius: 8px; background: #FEF2F2; color: #DC2626; border: none; cursor: pointer;"><i data-lucide="trash-2" style="width: 16px;"></i></button>
                            </div>
                        `}

                        <div id="reply-form-${rev.id}" style="display: none; margin-top: 12px;">
                            <textarea id="reply-text-${rev.id}" class="pay-input" style="width: 100%; font-size: 0.85rem; padding: 10px; border-radius: 8px; border: 1px solid var(--color-border);" placeholder="Tapez votre réponse ici...">${rev.admin_reply || ''}</textarea>
                            <div style="display: flex; gap: 8px; margin-top: 8px;">
                                <button class="btn btn-primary" onclick="submitReply('${rev.id}')" style="padding: 6px 12px; font-size: 0.8rem; border-radius: 8px;">Enregistrer</button>
                                <button class="btn btn-outline" onclick="toggleReply('${rev.id}')" style="padding: 6px 12px; font-size: 0.8rem; border-radius: 8px;">Annuler</button>
                            </div>
                        </div>
                    </td>
                `;
                    list.appendChild(tr);
                } catch (e) {
                    console.error("Review skip:", e);
                }
            });
        }

        function toggleReply(id) {
            const form = document.getElementById(`reply-form-${id}`);
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function confirmDeleteReview(id) {
            if (!confirm("Êtes-vous sûr de vouloir supprimer cet avis définitivement ? Cette action est irréversible.")) return;
            
            const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : '/api';

            try {
                const res = await fetch(`${API_URL}/reviews/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    location.reload();
                } else {
                    alert("Erreur lors de la suppression");
                }
            } catch (err) {
                alert("Erreur de connexion au serveur");
            }
        }

        async function submitReply(id) {
            const text = document.getElementById(`reply-text-${id}`).value;
            const API_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL) ? window.API_CONFIG.BASE_URL : '/api';

            try {
                const res = await fetch(`${API_URL}/reviews/${id}/reply`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reply: text })
                });

                if (res.ok) {
                    location.reload();
                } else {
                    alert("Erreur lors de l'enregistrement de la réponse");
                }
            } catch (err) {
                alert("Erreur de connexion au serveur");
            }
        }

        function updateStats(reviews) {
            if (!Array.isArray(reviews) || reviews.length === 0) return;
            
            let totalProduct = 0;
            let totalService = 0;
            let validCount = 0;

            reviews.forEach(r => {
                const rp = parseInt(r.rating_product) || parseInt(r.ratingproduct) || 0;
                const rs = parseInt(r.rating_service) || parseInt(r.ratingservice) || 0;
                if (rp > 0 || rs > 0) {
                    totalProduct += rp;
                    totalService += rs;
                    validCount++;
                }
            });
            
            const count = validCount || 1;
            document.getElementById('avg-product').textContent = (totalProduct / count).toFixed(1) + " / 5";
            document.getElementById('avg-service').textContent = (totalService / count).toFixed(1) + " / 5";
            document.getElementById('total-reviews').textContent = reviews.length;
        }
    </script>
</body>
</html>
