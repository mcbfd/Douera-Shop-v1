<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Utilisateurs | Douéra Shop Admin</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Mobile Menu Toggle -->
        <button id="mobileMenuBtn" class="mobile-menu-btn">
            <i data-lucide="menu"></i>
        </button>

        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="adminSidebar">
            <div class="sidebar-logo">
                <a href="../index.html">
                    <img src="../assets/logo douera shop.png" alt="Douéra Shop" style="height: 35px; width: auto; object-fit: contain;">
                </a>
                <button id="closeSidebarBtn" class="close-sidebar-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="products.html" class="nav-item"><i data-lucide="package"></i> Produits</a>
                <a href="orders.html" class="nav-item"><i data-lucide="shopping-cart"></i> Commandes</a>
                <a href="users.html" class="nav-item active"><i data-lucide="users"></i> Utilisateurs</a>
                <a href="reviews.html" class="nav-item"><i data-lucide="star"></i> Avis Clients</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn" style="color: #F87171;"><i data-lucide="log-out"></i> Déconnexion</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <header class="admin-header">
                <div>
                    <h1>Utilisateurs & Accès</h1>
                    <p style="color: var(--color-muted);">Gérez les rôles, les permissions et la sécurité.</p>
                </div>
                <div class="header-actions">
                    <button class="btn" id="openAddUserModal" style="display: none; background: rgba(43, 89, 162, 0.1); color: var(--color-primary-dark); border: none;"><i data-lucide="shield-plus"></i> Admin</button>
                    <button class="btn btn-primary" id="openAddClientModal"><i data-lucide="user-plus"></i> Client</button>
                </div>
            </header>

            <div class="data-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-list-body">
                        <!-- JS feeds this -->
                    </tbody>
                </table>
            </div>

            <div id="super-admin-only-msg"
                style="display: none; margin-top: 24px; padding: 24px; background: #FEF2F2; color: #991B1B; border-radius: 12px; font-weight: 600;">
                🔒 Certaines actions sont limitées car vous n'êtes pas Super Admin.
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="userModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 24px;">Modifier l'utilisateur</h2>
            <form id="userForm">
                <input type="hidden" id="u-id">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">Nom Complet</label>
                    <input type="text" id="u-name" class="pay-input" required>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">Email</label>
                    <input type="email" id="u-email" class="pay-input" required>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">Mot de passe</label>
                    <input type="password" id="u-password" class="pay-input" required placeholder="••••••••">
                </div>
                <div
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; margin-bottom: 32px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Rôle</label>
                        <select id="u-role" class="pay-input" style="appearance: none;">
                            <option value="admin">Administrateur</option>
                            <option value="super_admin">Super Admin</option>
                            <option value="client">Client</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Statut</label>
                        <select id="u-status" class="pay-input" style="appearance: none;">
                            <option value="active">Actif</option>
                            <option value="blocked">Bloqué</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Sexe</label>
                        <select id="u-gender" class="pay-input" style="appearance: none;">
                            <option value="M">Homme</option>
                            <option value="F">Femme</option>
                            <option value="O">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Téléphone</label>
                        <input type="tel" id="u-phone" class="pay-input" placeholder="77 000 00 00">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 700;">Pays</label>
                    <select id="u-country" class="pay-input">
                        <option value="Sénégal" selected>Sénégal</option>
                        <option value="France">France</option>
                        <option value="USA">USA</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Région</label>
                        <select id="u-region" class="pay-input">
                            <option value="" disabled selected>Région...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 700;">Ville / Dept</label>
                        <select id="u-city" class="pay-input">
                            <option value="" disabled selected>Ville...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 16px; margin-bottom: 32px;">
                    <label style="display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700;">
                        Adresse de livraison
                        <button type="button" onclick="getLocationAdmin()" style="background: none; border: none; color: var(--color-primary); font-size: 0.75rem; cursor: pointer;">📍 GPS</button>
                    </label>
                    <input type="text" id="u-address" class="pay-input" placeholder="Quartier, Rue...">
                </div>

                <div style="display: flex; gap: 16px;">
                    <button type="button" class="btn btn-outline" style="flex: 1;"
                        onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin-service.js"></script>
    <script src="../js/ui.js"></script>
    <script>
        let currentSession = null;
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', () => {
            currentSession = AdminService.checkAuth();
            
            // Mobile Menu Logic
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');

            const toggleMobileMenu = (show) => {
                sidebar.classList.toggle('active', show);
                overlay.style.display = show ? 'block' : 'none';
                document.body.style.overflow = show ? 'hidden' : '';
            };

            if (mobileMenuBtn) mobileMenuBtn.onclick = () => toggleMobileMenu(true);
            if (closeSidebarBtn) closeSidebarBtn.onclick = () => toggleMobileMenu(false);
            if (overlay) overlay.onclick = () => toggleMobileMenu(false);

            AdminService.startAutoRefresh(refreshData, 30000); 
            
            document.getElementById('logoutBtn').onclick = () => AdminService.logout();

            // Permissions Buttons
            if (currentSession.role === 'super_admin') {
                document.getElementById('openAddUserModal').style.display = 'flex';
                document.getElementById('openAddUserModal').onclick = () => openModal('admin');
            } else {
                document.getElementById('super-admin-only-msg').style.display = 'block';
            }

            document.getElementById('openAddClientModal').onclick = () => openModal('client');

            document.getElementById('userForm').onsubmit = async (e) => {
                e.preventDefault();
                const user = {
                    id: document.getElementById('u-id').value || null,
                    name: document.getElementById('u-name').value,
                    email: document.getElementById('u-email').value,
                    role: document.getElementById('u-role').value,
                    status: document.getElementById('u-status').value,
                    password: document.getElementById('u-password').value,
                    gender: document.getElementById('u-gender').value,
                    phone: document.getElementById('u-phone').value,
                    country: document.getElementById('u-country').value,
                    region: document.getElementById('u-region').value,
                    city: document.getElementById('u-city').value,
                    address: document.getElementById('u-address').value
                };
                try {
                    await AdminService.saveUser(user);
                    UI.showToast("Compte enregistré avec succès", "success");
                    closeModal();
                    await refreshData();
                } catch (err) {
                    UI.showToast(err.message, "error");
                }
            };
        });

        async function refreshData() {
            allUsers = await AdminService.getUsers();
            renderUsers();
        }

        function renderUsers() {
            const list = document.getElementById('users-list-body');
            list.innerHTML = '';

            allUsers.forEach(u => {
                const tr = document.createElement('tr');
                const isSuper = currentSession.role === 'super_admin';
                const isSelf = currentSession.userId === u.id;
                const isClient = u.role === 'client';

                // Permission logique : Admin Standard peut gérer les Clients, Super Admin gère Tout
                const canManage = isSuper || (isClient && currentSession.role === 'admin') || isSelf;

                tr.className = 'animate-fade-in';
                tr.innerHTML = `
                    <td data-label="Nom">
                        <div style="font-weight: 800; font-family: 'Outfit', sans-serif; font-size: 1.1rem; color: var(--color-foreground);">${u.name} ${isSelf ? '<span style="font-size: 0.75rem; background: var(--color-primary); color: white; padding: 2px 8px; border-radius: 12px; font-weight: 800; margin-left: 8px;">VOUS</span>' : ''}</div>
                    </td>
                    <td data-label="Email" style="color: var(--color-muted); font-size: 0.95rem;">${u.email}</td>
                    <td data-label="Rôle"><span class="badge ${u.role === 'super_admin' ? 'badge-paid' : (u.role === 'admin' ? 'badge-shipping' : 'badge-pending')}" style="font-family: 'Outfit', sans-serif;">${u.role.replace('_', ' ')}</span></td>
                    <td data-label="Statut"><span class="badge ${u.status === 'active' ? 'badge-delivered' : 'badge-pending'}" style="font-family: 'Outfit', sans-serif;">${u.status}</span></td>
                    <td data-label="Actions">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn" style="padding: 10px; border-radius: 12px; background: rgba(59, 130, 246, 0.1); color: var(--color-primary); border: none; cursor: pointer; transition: var(--transition-base);" onclick="openModal(null, '${u.id}')" ${!canManage ? 'disabled style="opacity: 0.3; cursor: not-allowed;"' : ''}><i data-lucide="edit-2" style="width: 18px;"></i></button>
                            <button class="btn" style="padding: 10px; border-radius: 12px; background: rgba(239, 68, 68, 0.1); color: #DC2626; border: none; cursor: pointer; transition: var(--transition-base);" onclick="confirmDelete('${u.id}')" ${!canManage || isSelf ? 'disabled style="opacity: 0.3; cursor: not-allowed;"' : ''}><i data-lucide="trash-2" style="width: 18px;"></i></button>
                        </div>
                    </td>
                `;
                list.appendChild(tr);
            });
            if (window.lucide) lucide.createIcons();
        }

        async function confirmDelete(id) {
            const u = allUsers.find(x => x.id === id);
            const confirmed = await UI.showConfirm(
                "Supprimer l'utilisateur ?",
                `Êtes-vous sûr de vouloir supprimer définitivement le compte de ${u.name} ? Cette action est irréversible.`
            );
            if (confirmed) {
                await AdminService.deleteUser(id);
                UI.showToast("Utilisateur supprimé", "success");
                await refreshData();
            }
        }

        function openModal(defaultRole = 'client', id = null) {
            const overlay = document.getElementById('userModal');
            document.getElementById('userForm').reset();
            document.getElementById('u-id').value = '';
            document.getElementById('u-password').required = true;

            // Restrictions de rôle pour le formulaire
            const roleSelect = document.getElementById('u-role');
            if (currentSession.role !== 'super_admin') {
                // Un admin standard ne peut créer/modifier que des clients
                roleSelect.innerHTML = '<option value="client">Client</option>';
            } else {
                roleSelect.innerHTML = `
                    <option value="admin">Administrateur</option>
                    <option value="super_admin">Super Admin</option>
                    <option value="client">Client</option>
                `;
            }

            const uGender = document.getElementById('u-gender');
            const uCountry = document.getElementById('u-country');
            const uRegion = document.getElementById('u-region');
            const uCity = document.getElementById('u-city');
            const uAddress = document.getElementById('u-address');

            if (id) {
                const u = allUsers.find(x => x.id === id);
                document.getElementById('u-id').value = u.id;
                document.getElementById('u-name').value = u.name;
                document.getElementById('u-email').value = u.email;
                document.getElementById('u-role').value = u.role;
                document.getElementById('u-status').value = u.status;
                document.getElementById('u-password').value = ''; 
                document.getElementById('u-password').placeholder = 'Laisser vide pour ne pas changer';
                uGender.value = u.gender || 'M';
                document.getElementById('u-phone').value = u.phone || '';
                uCountry.value = u.country || 'Sénégal';
                
                // Trigger region update
                updateRegionsAdmin();
                uRegion.value = u.region || '';
                updateCitiesAdmin();
                uCity.value = u.city || '';
                
                uAddress.value = u.address || '';
                document.getElementById('modalTitle').textContent = "Modifier l'utilisateur";
                document.getElementById('u-password').required = false;
            } else {
                document.getElementById('u-role').value = defaultRole;
                document.getElementById('u-password').placeholder = 'Entrez un mot de passe';
                document.getElementById('modalTitle').textContent = defaultRole === 'admin' ? "Nouvel Administrateur" : "Nouveau Client";
                uGender.value = 'M';
                uCountry.value = 'Sénégal';
                updateRegionsAdmin();
                uRegion.value = '';
                uCity.innerHTML = '<option value="" disabled selected>Ville...</option>';
                uAddress.value = '';
            }

            overlay.classList.add('active');
        }

        // --- Localization Logic Admin ---
        const senegalData = {
            "Dakar": ["Dakar", "Pikine", "Guédiawaye", "Rufisque"],
            "Saint-Louis": ["Saint-Louis", "Dagana", "Podor"],
            "Thiès": ["Thiès", "Mbour", "Tivaouane"],
            "Kaolack": ["Kaolack", "Nioro du Rip", "Guinguinéo"],
            "Ziguinchor": ["Ziguinchor", "Bignona", "Oussouye"],
            "Louga": ["Louga", "Linguère", "Kébémer"],
            "Diourbel": ["Diourbel", "Bambey", "Mbacké"],
            "Tambacounda": ["Tambacounda", "Bakel", "Goudiry", "Koumpentoum"],
            "Kolda": ["Kolda", "Vélingara", "Médina Yoro Foulah"],
            "Matam": ["Matam", "Kanel", "Ranérou Ferlo"],
            "Kaffrine": ["Kaffrine", "Birkelane", "Koungheul", "Malem Hodar"],
            "Kédougou": ["Kédougou", "Salémata", "Saraya"],
            "Sédhiou": ["Sédhiou", "Bounkiling", "Goudomp"],
            "Fatick": ["Fatick", "Foundiougne", "Gossas"]
        };

        function updateRegionsAdmin() {
            const regSelect = document.getElementById('u-region');
            regSelect.innerHTML = '<option value="" disabled selected>Région...</option>';
            Object.keys(senegalData).sort().forEach(reg => {
                const opt = document.createElement('option');
                opt.value = reg;
                opt.textContent = reg;
                regSelect.appendChild(opt);
            });
        }

        function updateCitiesAdmin() {
            const reg = document.getElementById('u-region').value;
            const citySelect = document.getElementById('u-city');
            citySelect.innerHTML = '<option value="" disabled selected>Ville...</option>';
            if (senegalData[reg]) {
                senegalData[reg].sort().forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    citySelect.appendChild(opt);
                });
            }
        }

        document.getElementById('u-region').onchange = updateCitiesAdmin;

        async function getLocationAdmin() {
            if (navigator.geolocation) {
                UI.showToast("Localisation...", "info");
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                        const data = await res.json();
                        if (data.display_name) {
                            document.getElementById('u-address').value = data.display_name;
                            UI.showToast("Localisé !", "success");
                        }
                    } catch(e) { UI.showToast("Coordonnées GPS captées", "success"); }
                });
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }
    </script>
</body>

</html>
