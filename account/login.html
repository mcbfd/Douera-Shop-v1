<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre compte Douéra Shop.">
    <meta name="keywords" content="connexion, login, Douéra Shop, e-commerce, compte">
    <title>Connexion | Douéra Shop</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>
<body style="margin: 0; padding: 0; display: flex; min-height: 100vh; background: var(--color-background); font-family: 'Inter', sans-serif; align-items: center; justify-content: center; position: relative; overflow: hidden;">

    <!-- Background decoration -->
    <div style="position: absolute; top: -20%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(43, 89, 162, 0.05), transparent 70%); border-radius: 50%; pointer-events: none;"></div>
    <div style="position: absolute; bottom: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(43, 89, 162, 0.05), transparent 70%); border-radius: 50%; pointer-events: none;"></div>

    <!-- Go Back Link -->
    <a href="../index.html" style="position: absolute; top: 40px; left: 40px; display: flex; align-items: center; gap: 8px; color: var(--color-muted); text-decoration: none; font-weight: 600; transition: var(--transition-base); z-index: 20;" onmouseover="this.style.color='var(--color-primary)'" onmouseout="this.style.color='var(--color-muted)'">
        <i data-lucide="arrow-left" style="width: 20px;"></i> Retour à la boutique
    </a>

    <!-- Login Centered Card -->
    <div class="animate-fade-in" style="width: 100%; max-width: 480px; background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); padding: 50px 40px; position: relative; z-index: 10; border: 1px solid var(--color-border); margin: 20px;">
        
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="background: white; width: 90px; height: 90px; border-radius: 24px; display: flex; align-items: center; justify-content: center; padding: 15px; margin: 0 auto 24px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border: 1px solid var(--color-border);">
                <img src="../assets/logo.png" alt="Douéra Shop" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <h2 style="font-size: 2rem; color: var(--color-primary-dark); font-weight: 800; font-family: 'Outfit', sans-serif; margin-bottom: 8px;">Bon retour ! 👋</h2>
            <p style="color: var(--color-muted); font-size: 0.95rem;">Connectez-vous pour continuer vos achats.</p>
        </div>
        
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- inputs -->
            <div class="form-group">
                <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Email</label>
                <div style="position: relative;">
                    <i data-lucide="mail" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                    <input type="email" id="email" required class="pay-input" placeholder="exemple@mail.com" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                </div>
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <label style="color: var(--color-foreground); font-weight: 700; font-size: 0.9rem;">Mot de Passe</label>
                    <a href="#" style="color: var(--color-primary); font-size: 0.8rem; font-weight: 600; text-decoration: none;">Oublié ?</a>
                </div>
                <div style="position: relative;">
                    <i data-lucide="lock" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                    <input type="password" id="password" required class="pay-input" placeholder="••••••••" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="remember" style="width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer;">
                <label for="remember" style="color: var(--color-muted); font-size: 0.85rem; cursor: pointer;">Se souvenir de moi</label>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 800; border-radius: 14px; margin-top: 8px; justify-content: center; box-shadow: 0 10px 20px rgba(43, 89, 162, 0.2);">
                Se connecter <i data-lucide="arrow-right" style="margin-left: 8px; width: 20px;"></i>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--color-border);">
            <p style="color: var(--color-muted); font-size: 0.9rem;">
                Pas encore de compte ? <a href="register.html" style="color: var(--color-primary); font-weight: 700; text-decoration: none;">Inscrivez-vous</a>
            </p>
        </div>
    </div>

    <!-- Floating Chat Excellence -->
    <a href="https://wa.me/221781607468" style="position: fixed; bottom: 40px; right: 40px; width: 72px; height: 72px; background: #25D366; color: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(37, 211, 102, 0.4); z-index: 1500; transition: var(--transition-base); text-decoration: none;">
        <i data-lucide="message-circle" style="width: 32px; height: 32px;"></i>
    </a>

    <!-- Alibaba Style Bottom Nav Bar (Mobile Only) -->
    <nav class="mobile-bottom-nav">
        <a href="../index.html" class="nav-item">
            <i data-lucide="home"></i>
            <span>Accueil</span>
        </a>
        <a href="../index.html#notre-boutique" class="nav-item">
            <i data-lucide="search"></i>
            <span>Recherche</span>
        </a>
        <a href="../cart.html" class="nav-item cart-nav-item">
            <div style="position: relative;">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count nav-badge">0</span>
            </div>
            <span>Panier</span>
        </a>
        <a href="login.html" class="nav-item active">
            <i data-lucide="user"></i>
            <span>Compte</span>
        </a>
    </nav>

    <div id="toast-container"></div>

    <script src="../js/ui.js"></script>
    <script src="../js/auth-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.setLoading(btn, true, "Connexion...");

                const email = document.getElementById('email').value;
                const pass = document.getElementById('password').value;

                try {
                    const session = await AuthService.login(email, pass);
                    UI.showToast(`Ravi de vous revoir, ${session.name} !`, "success");
                    
                    setTimeout(() => {
                        const redirect = localStorage.getItem('auth_redirect') || '../index.html';
                        localStorage.removeItem('auth_redirect');
                        window.location.href = redirect;
                    }, 500);
                } catch (err) {
                    UI.showToast(err.message, "error");
                    UI.setLoading(btn, false, "Se connecter");
                }
            });
        });
    </script>
</body>
</html>
