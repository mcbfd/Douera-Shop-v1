<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inscrivez-vous sur Douéra Shop pour accéder à des produits exclusifs.">
    <meta name="keywords" content="inscription, register, Douéra Shop, e-commerce, compte">
    <title>Inscription | Douéra Shop</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../style.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
</head>
<body style="margin: 0; padding: 0; display: flex; min-height: 100vh; background: var(--color-background); font-family: 'Inter', sans-serif; align-items: center; justify-content: center; position: relative; overflow-x: hidden;">

    <!-- Background decoration -->
    <div style="position: absolute; top: -20%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(43, 89, 162, 0.05), transparent 70%); border-radius: 50%; pointer-events: none;"></div>
    <div style="position: absolute; bottom: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(43, 89, 162, 0.05), transparent 70%); border-radius: 50%; pointer-events: none;"></div>

    <!-- Go Back Link -->
    <a href="../index.html" style="position: absolute; top: 40px; left: 40px; display: flex; align-items: center; gap: 8px; color: var(--color-muted); text-decoration: none; font-weight: 600; transition: var(--transition-base); z-index: 20;" onmouseover="this.style.color='var(--color-primary)'" onmouseout="this.style.color='var(--color-muted)'">
        <i data-lucide="arrow-left" style="width: 20px;"></i> Retour à la boutique
    </a>

    <!-- Register Centered Card -->
    <div class="animate-fade-in" style="width: 100%; max-width: 550px; background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); padding: 50px 40px; position: relative; z-index: 10; border: 1px solid var(--color-border); margin: 80px 20px 40px;">
        
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="background: white; width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 12px; margin: 0 auto 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border: 1px solid var(--color-border);">
                <img src="../assets/logo.png" alt="Douéra Shop" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <h2 style="font-size: 1.8rem; color: var(--color-primary-dark); font-weight: 800; font-family: 'Outfit', sans-serif; margin-bottom: 8px;">Créer un compte</h2>
            <p style="color: var(--color-muted); font-size: 0.95rem;">Rejoignez l'élite du shopping à Douéra.</p>
        </div>
        
        <form id="registerForm" style="display: flex; flex-direction: column; gap: 20px;">
            <div class="form-group">
                <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Nom complet</label>
                <div style="position: relative;">
                    <i data-lucide="user" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                    <input type="text" id="name" required class="pay-input" placeholder="Ex: Modou Fall" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                </div>
            </div>

            <div class="form-group">
                <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Email</label>
                <div style="position: relative;">
                    <i data-lucide="mail" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                    <input type="email" id="email" required class="pay-input" placeholder="modou@example.com" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Sénégal (+221)</label>
                    <div style="position: relative;">
                        <i data-lucide="phone" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                        <input type="tel" id="phone" required class="pay-input" placeholder="77 000 00 00" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Quartier</label>
                    <div style="position: relative;">
                        <i data-lucide="map-pin" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                        <input type="text" id="address" required class="pay-input" placeholder="Ex: Quartier Escale" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label style="display: block; color: var(--color-foreground); margin-bottom: 8px; font-weight: 700; font-size: 0.9rem;">Mot de Passe</label>
                <div style="position: relative;">
                    <i data-lucide="lock" style="position: absolute; left: 16px; top: 16px; width: 20px; color: var(--color-muted);"></i>
                    <input type="password" id="password" required class="pay-input" placeholder="••••••••" style="width: 100%; padding: 16px 16px 16px 48px; border-radius: 14px; border: 2px solid var(--color-border); background: var(--color-background); font-size: 1rem; transition: var(--transition-base); outline: none;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.background='white';" onblur="this.style.borderColor='var(--color-border)'; this.style.background='var(--color-background)';">
                </div>
                <p style="font-size: 0.8rem; color: var(--color-muted); margin-top: 6px;">Minimum 8 caractères conseillé.</p>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 4px;">
                <input type="checkbox" id="terms" required style="width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer; margin-top: 2px;">
                <label for="terms" style="color: var(--color-muted); font-size: 0.85rem; cursor: pointer; line-height: 1.4;">J'accepte les <a href="#" style="color: var(--color-primary); text-decoration: none;">conditions d'utilisation</a> et la politique de confidentialité.</label>
            </div>

            <button type="submit" id="regBtn" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 800; border-radius: 14px; margin-top: 8px; justify-content: center; box-shadow: 0 10px 20px rgba(43, 89, 162, 0.2);">
                Créer mon compte <i data-lucide="arrow-right" style="margin-left: 8px; width: 20px;"></i>
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--color-border);">
            <p style="color: var(--color-muted); font-size: 0.9rem;">
                Déjà inscrit ? <a href="login.html" style="color: var(--color-primary); font-weight: 700; text-decoration: none;">Connectez-vous</a>
            </p>
        </div>
    </div>

    <!-- Floating Chat Excellence -->
    <a href="https://wa.me/221781607468" style="position: fixed; bottom: 40px; right: 40px; width: 72px; height: 72px; background: #25D366; color: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(37, 211, 102, 0.4); z-index: 1500; transition: var(--transition-base); text-decoration: none;">
        <i data-lucide="message-circle" style="width: 32px; height: 32px;"></i>
    </a>

    <div id="toast-container"></div>

    <script src="../js/ui.js"></script>
    <script src="../js/auth-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const form = document.getElementById('registerForm');
            const btn = document.getElementById('regBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.setLoading(btn, true, "Création du compte...");

                const userData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    password: document.getElementById('password').value
                };

                try {
                    await AuthService.register(userData);
                    UI.showToast("Bienvenue chez Douéra Shop !", "success");
                    
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 500);
                } catch (err) {
                    UI.showToast(err.message, "error");
                    UI.setLoading(btn, false, "Créer mon compte");
                }
            });
        });
    </script>
</body>
</html>
